<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    // Default is the dark ops board. Wallpaper mode still preloads the 3D office (the hash never leaves the browser).
    (function () {
      var wall = /(?:^|[?&])mode=wallpaper(?:&|$)/.test(location.search);
      if (!wall) { document.documentElement.classList.add('ops'); return; }
      document.documentElement.classList.add('wallpaper');
      var m = document.createElement('link');
      m.rel = 'modulepreload';
      m.href = 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
      document.head.appendChild(m);
      var g = document.createElement('link');
      g.rel = 'preload'; g.as = 'fetch'; g.crossOrigin = 'anonymous';
      g.href = '../assets/office/office.glb';
      document.head.appendChild(g);
    })();
  </script>
  <title>Grok Bot 儀表板</title>
  <meta name="description" content="你的 Grok Bot 即時狀態看板：誰在工作、誰在等你、哪裡出錯。">
  <!-- the link preview (Telegram, X, iMessage): the dashboard itself -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Grok Bot 儀表板">
  <meta property="og:title" content="Grok Bot 儀表板">
  <meta property="og:description" content="你的 Grok Bot 即時狀態看板：誰在工作、誰在等你、哪裡出錯。">
  <meta property="og:image" content="https://bodila51.github.io/grokbot-wallpaper/assets/brand/og-dashboard.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Grok Bot 儀表板">
  <meta name="twitter:image" content="https://bodila51.github.io/grokbot-wallpaper/assets/brand/og-dashboard.png">
  <link rel="icon" type="image/png" href="../assets/brand/logo-mark.png">
  <link rel="apple-touch-icon" href="../assets/brand/logo-mark.png">
  <meta name="theme-color" content="#07090d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./scene/scene.css">
  <link rel="stylesheet" href="./ui/board.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="ops"><p class="ops-boot">正在連接狀態…</p></div>
  <main id="scene" aria-label="辦公室"><div class="hq-loading" role="status"><span class="hq-loading-label">正在建造辦公室</span><span class="hq-loading-track"><i></i></span></div></main>
  <header id="topbar"></header>
  <nav id="floors" aria-label="樓層"></nav>
  <aside id="panel" aria-label="機器人卡片與樓層團隊"></aside>
  <section id="feed" aria-label="動態訊息"></section>
  <script type="module" src="./app.js"></script>
</body>
</html>
