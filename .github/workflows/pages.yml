# GitHub Pages publish is paused on this fork so it does not go live beside Cloudflare Pages.
# Setup and the manual wrangler alternative: docs/cloudflare-pages.md
# To publish here again, restore the push trigger (branches: [main]). workflow_dispatch remains
# a manual escape hatch; this change does not run it and does not deploy.
#
# Push to main no longer publishes. workflow_dispatch still builds the assembled tree:
# /          redirect to office/ (hash and query kept; not the marketing landing)
# /office/   the 3D office
# /face/     the wallpaper itself with its demo data (installed wallpapers
# point here and pick up every change by themselves). landing/assemble.mjs lists what goes out (no journal, keys,
# source art, or marketing landing).
name: Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: node landing/assemble.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
